services:
  deepseek-v41:
    image: ${VLLM_IMAGE:-localhost/deepseek-v41-cmp170hx:latest}
    container_name: deepseek-v41
    restart: "no"
    network_mode: host
    shm_size: "16gb"
    stop_grace_period: 10m

    devices:
      - nvidia.com/gpu=0
      - nvidia.com/gpu=1
      - nvidia.com/gpu=2
      - nvidia.com/gpu=3
      - nvidia.com/gpu=4
      - nvidia.com/gpu=5

    security_opt:
      - label=disable

    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_PP_LAYER_PARTITION: "7,7,7,7,7,5"
      VLLM_CPU_OFFLOAD_GB_PER_RANK: "0,0,0,0,0,0"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "128"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      NCCL_ALGO: "Ring"
      NCCL_PROTO: "Simple"
      NCCL_P2P_DISABLE: "1"
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/tmp

    volumes:
      - ${MODEL_ROOT:-/root/app/models}:/models:ro
      - ${VLLM_CACHE:-/root/app/deepseek-v41/cache}:/root/.cache

    command:
      - /models/DeepSeek-V4.1-Flash
      - --host=0.0.0.0
      - --port=8000
      - --served-model-name=deepseek-ai/DeepSeek-V4.1-Flash
      - --pipeline-parallel-size=6
      - --tensor-parallel-size=1
      - --max-model-len=1048576
      - --max-num-batched-tokens=4096
      - --max-num-seqs=64
      - --kv-cache-dtype=fp8_ds_mla
      # PP6 rank 2 owns the largest weight shard plus Engram L14. Let vLLM
      # profile the latest automatic CUDA Graph set and size KV from 94% of
      # HBM instead of forcing the former 8-GiB-per-rank budget.
      - --gpu-memory-utilization=0.94
      - --trust-remote-code
      - --disable-custom-all-reduce
      - --enable-prefix-caching
      - '--engram-config={"cpu_offload":true}'
      # Deliberately omit --compilation-config. vLLM derives DSpark-aware CUDA
      # Graph sizes from the six-token target verification width, max_num_seqs,
      # and the platform capture ceiling.
      - '--speculative-config={"method":"dspark","num_speculative_tokens":5,"use_local_argmax_reduction":true}'
      - --tokenizer-mode=deepseek_v41
      - --enable-auto-tool-choice
      - '--structured-outputs-config={"backend":"auto","disable_any_whitespace":false}'
      - --tool-call-parser=deepseek_v41
      - --reasoning-parser=deepseek_v41
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY in .env}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 75m
      retries: 3
