services:
  qwen38-nvfp4-spark:
    image: ${VLLM_IMAGE:-vllm-qwen38-nvfp4-spark:latest}
    container_name: qwen38-nvfp4-spark
    restart: unless-stopped
    ipc: host
    security_opt:
      - label=disable
    devices:
      - /dev/nvidia0:/dev/nvidia0
      - /dev/nvidiactl:/dev/nvidiactl
      - /dev/nvidia-uvm:/dev/nvidia-uvm
      - /dev/nvidia-uvm-tools:/dev/nvidia-uvm-tools
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${QWEN_MODEL_CACHE:?}:/root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4:ro
      - ${VLLM_COMPILE_CACHE:-/home/canoziia/.cache/vllm-qwen38-nvfp4-spark}:/root/.cache/vllm
      - /run/opengl-driver:/run/opengl-driver:ro
      - /nix/store:/nix/store:ro
    environment:
      LD_LIBRARY_PATH: /run/opengl-driver/lib:/usr/local/cuda/lib64
      HF_HUB_OFFLINE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--RadixArk--Qwen3.8-Flash-Next-NVFP4/snapshots/${QWEN_SNAPSHOT:?}
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "16"
      VLLM_PLE_NEXT_CHUNK_PREFETCH: "1"
      SAFETENSORS_FAST_GPU: "0"
    command:
      - RadixArk/Qwen3.8-Flash-Next-NVFP4
      - --revision=${QWEN_SNAPSHOT:?}
      - --tensor-parallel-size=1
      - --pipeline-parallel-size=1
      - --language-model-only
      - --max-model-len=262144
      - --kv-cache-dtype=bfloat16
      - --prefix-match-unit=32
      - --mamba-ssm-cache-dtype=bfloat16
      - --mamba-cache-mode=align
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - --api-key=${VLLM_API_KEY:-change-me}
      - --served-model-name=RadixArk/Qwen3.8-Flash-Next-NVFP4
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-num-seqs=4
      - --max-num-batched-tokens=4096
      - --gpu-memory-utilization=0.90
      - --long-prefill-token-threshold=0
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-flashinfer-autotune
