# Standalone Prometheus + Grafana for the vLLM / vllm-router / LMCache
# endpoints of every node. Independent from the model compose files: it only
# scrapes HTTP /metrics, never touches the engines.
#
# .env (0600, not committed): see .env.example. GRAFANA_ADMIN_PASSWORD is
# required. Targets are rendered from env into file_sd JSON at start
# (prometheus/entrypoint.sh); to change them edit .env and run
#   podman compose down && podman compose up -d   (data is kept)
#
# Host networking (as in the model compose files): Prometheus can reach the
# 127.0.0.1-only LMCache/router ports of this node and Grafana talks to
# Prometheus over 127.0.0.1. Prometheus has no auth, keep PROM_LISTEN on
# 127.0.0.1 unless the port is firewalled.
#
# Start:  podman compose up -d
# GPU:    podman compose --profile gpu up -d   (nvidia-smi exporter, optional)
# Data dirs are bind mounts with :U (podman chowns them to the container user).
services:
  prometheus:
    image: docker.io/prom/prometheus:v3.5.0
    container_name: vllm-monitoring-prometheus
    restart: unless-stopped
    network_mode: host
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      VLLM_METRICS_TARGETS: ${VLLM_METRICS_TARGETS:?set VLLM_METRICS_TARGETS}
      ROUTER_METRICS_TARGETS: ${ROUTER_METRICS_TARGETS:-}
      LMCACHE_METRICS_TARGETS: ${LMCACHE_METRICS_TARGETS:-}
      GPU_METRICS_TARGETS: ${GPU_METRICS_TARGETS:-}
      VLLM_SERVER_NAMES: ${VLLM_SERVER_NAMES:-}
      VLLM_METRICS_BEARER_TOKEN_FILE: /run/secrets/vllm_metrics_token
      PROM_LISTEN: ${PROM_LISTEN:-127.0.0.1}
      PROM_PORT: ${PROM_PORT:-19090}
      PROM_RETENTION: ${PROM_RETENTION:-180d}
      PROM_RETENTION_SIZE: ${PROM_RETENTION_SIZE:-50GB}
      PROM_SCRAPE_INTERVAL: ${PROM_SCRAPE_INTERVAL:-10s}
    volumes:
      - ./prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - ${VLLM_METRICS_TOKEN_FILE:-/dev/null}:/run/secrets/vllm_metrics_token:ro
      - ${MONITORING_DATA_DIR:-/root/app/monitoring-data}/prometheus:/prometheus:U

  grafana:
    image: docker.io/grafana/grafana:12.1.1
    container_name: vllm-monitoring-grafana
    restart: unless-stopped
    network_mode: host
    depends_on: [prometheus]
    environment:
      GF_SERVER_HTTP_ADDR: ${GRAFANA_LISTEN:-0.0.0.0}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-13000}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vllm/vllm-throughput.json
      PROM_PORT: ${PROM_PORT:-19090}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/vllm:ro
      - ${MONITORING_DATA_DIR:-/root/app/monitoring-data}/grafana:/var/lib/grafana:U

  # Optional (profile gpu): nvidia-smi based exporter. dcgm-exporter is not
  # used because DCGM profiling metrics are not available on CMP 170HX.
  # Add this node to GPU_METRICS_TARGETS, e.g. node2=127.0.0.1:19835.
  gpu-exporter:
    image: docker.io/utkuozdemir/nvidia_gpu_exporter:1.3.2
    container_name: vllm-monitoring-gpu-exporter
    profiles: [gpu]
    restart: unless-stopped
    network_mode: host
    command: ["--web.listen-address=${GPU_EXPORTER_LISTEN:-127.0.0.1}:${GPU_EXPORTER_PORT:-19835}"]
    devices:
      - nvidia.com/gpu=all
    security_opt: ["label=disable"]
