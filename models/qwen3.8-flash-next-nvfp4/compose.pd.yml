# Qwen3.8 Flash Next NVFP4 with prefill/decode disaggregation, four GPUs.
#
# Disaggregation is realised through the shared LMCache tier rather than through
# a dedicated KV-transfer connector. The prefill role computes the prompt and
# stores the resulting KV in the shared LMCache server; the decode role then
# retrieves that KV instead of recomputing it and runs the MTP speculator.
# Both roles are ordinary vLLM servers sharing the same model, the same
# served-model-name (so the LMCache keys match), and the same LMCache server.
#
# GPU map (CMP 170HX 20c2, 64 GiB BAR1 each):
#   prefill : GPUs 0,1   PP2 even   "24,24"   - no speculative decoding
#   decode  : GPUs 2,3   PP2 uneven "26,22"   - MTP, the validated PP2 layout
#   lmcache : sees GPUs 0,1,2,3 because the MP connector exchanges KV through
#             CUDA IPC with the server process
# The model has 48 transformer layers plus a 1-layer MTP module.
#
# Request flow is two-step (prefill with max_tokens=1, then decode the same
#   1. POST the prompt to the prefill server with max_tokens=1, so only the
#      prompt is computed and its KV lands in LMCache;
#   2. POST the same prompt to the decode server, which loads the prompt KV from
#      LMCache and generates the answer.
x-podman:
  in_pod: false

services:
  qwen3.8-flash-next-nvfp4-lmcache:
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: qwen3.8-flash-next-nvfp4-lmcache
    restart: "no"
    entrypoint: ["lmcache"]
    network_mode: host
    # podman-compose 1.3.0 ignores this key; start with
#   podman compose -f compose.pd.yml --podman-run-args=--ipc=host up -d
    # which is required because the connector moves KV over CUDA IPC.
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    # 单实例 LMCache 由两个引擎共用，必须能看到两个引擎的全部 GPU（1..4）；
    # node1 是单引擎，所以它那里只需要自己的两张卡。
    devices:
      - nvidia.com/gpu=1
      - nvidia.com/gpu=2
      - nvidia.com/gpu=3
      - nvidia.com/gpu=4
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:?set LMCACHE_L2_PATH}:/lmcache-l2
    command:
      - server
      - --host=127.0.0.1
      - --port=5557
      - --http-host=127.0.0.1
      - --http-port=18557
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1600}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-64}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":${LMCACHE_L2_CAPACITY_GB:-500},"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18557/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  qwen3.8-flash-next-nvfp4-prefill:
    image: ${QWEN_IMAGE:-localhost/vllm-backport:qwen3.8-flash-next-nvfp4}
    container_name: qwen3.8-flash-next-nvfp4-prefill
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    stop_grace_period: 10m
    devices:
      - nvidia.com/gpu=1
      - nvidia.com/gpu=2
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${QWEN_MODEL_CACHE:?set QWEN_MODEL_CACHE}:/root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4:ro
      - ${VLLM_CACHE_PREFILL:?set VLLM_CACHE_PREFILL}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "26,22"   # must match the decode role: the resolved KV
      #   block size / mamba page geometry depends on the partition (26,22 -> 1600,
      #   24,24 -> 1568), and the shared LMCache tier can only hold one geometry.
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/snapshots/fc694b54fb0174e0913e6adf86691ef85a4ead47
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "48"
      VLLM_PLE_NEXT_CHUNK_PREFETCH: "1"
      SAFETENSORS_FAST_GPU: "0"
      TORCH_CUDA_ARCH_LIST: "8.0 8.6 8.9"
      VLLM_ENABLE_CUDA_COMPATIBILITY: "0"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      NCCL_CUMEM_HOST_ENABLE: "0"
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
    command:
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --host=0.0.0.0
      - --port=8101
      - --served-model-name=nvidia/Qwen3.8-Flash-Next-NVFP4
      - --revision=${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      - --pipeline-parallel-size=2
      - --tensor-parallel-size=1
      - --quantization=modelopt
      - --trust-remote-code
      - --max-model-len=1000000
      - --max-num-seqs=${PREFILL_MAX_NUM_SEQS:-32}
      - --max-num-batched-tokens=${PREFILL_MAX_BATCHED_TOKENS:-4096}
      - --kv-cache-memory=${PREFILL_KV_CACHE_MEMORY:-17179869184}
      - --kv-cache-dtype=bfloat16
      # The KV block geometry is resolved from num_speculative_tokens (via the
      # Qwen QSA ring term), so the prefill role must declare the same MTP depth
      # as decode or the two roles would resolve different block sizes (1568 vs
      # 1600) and the shared LMCache tier could not hold both layouts.
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${QWEN_MTP_TOKENS:-3}}'
      - --per-request-spec-decode-metrics=detailed
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --disable-custom-all-reduce
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --prefix-match-unit=32
      - --mamba-cache-mode=align
      - --prefix-cache-retention-interval=${QWEN_PREFIX_RETENTION_INTERVAL:-1600}
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_ip":"127.0.0.1","kv_port":14579,"kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5557}}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - --structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8101/health"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3

  qwen3.8-flash-next-nvfp4-decode:
    image: ${QWEN_IMAGE:-localhost/vllm-backport:qwen3.8-flash-next-nvfp4}
    container_name: qwen3.8-flash-next-nvfp4-decode
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    stop_grace_period: 10m
    devices:
      - nvidia.com/gpu=3
      - nvidia.com/gpu=4
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${QWEN_MODEL_CACHE:?set QWEN_MODEL_CACHE}:/root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4:ro
      - ${VLLM_CACHE_DECODE:?set VLLM_CACHE_DECODE}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "26,22"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/snapshots/fc694b54fb0174e0913e6adf86691ef85a4ead47
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "48"
      VLLM_PLE_NEXT_CHUNK_PREFETCH: "1"
      SAFETENSORS_FAST_GPU: "0"
      TORCH_CUDA_ARCH_LIST: "8.0 8.6 8.9"
      VLLM_ENABLE_CUDA_COMPATIBILITY: "0"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      NCCL_CUMEM_HOST_ENABLE: "0"
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
    command:
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --host=0.0.0.0
      - --port=8102
      - --served-model-name=nvidia/Qwen3.8-Flash-Next-NVFP4
      - --revision=${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      - --pipeline-parallel-size=2
      - --tensor-parallel-size=1
      - --quantization=modelopt
      - --trust-remote-code
      - --max-model-len=1000000
      - --max-num-seqs=${DECODE_MAX_NUM_SEQS:-32}
      - --max-num-batched-tokens=${DECODE_MAX_BATCHED_TOKENS:-4096}
      - --kv-cache-memory=${DECODE_KV_CACHE_MEMORY:-17179869184}
      - --kv-cache-dtype=bfloat16
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${QWEN_MTP_TOKENS:-3}}'
      - --per-request-spec-decode-metrics=detailed
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --disable-custom-all-reduce
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --prefix-match-unit=32
      - --mamba-cache-mode=align
      - --prefix-cache-retention-interval=${QWEN_PREFIX_RETENTION_INTERVAL:-1600}
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_ip":"127.0.0.1","kv_port":14580,"kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5557}}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - --structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8102/health"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3
  qwen3.8-flash-next-nvfp4-pd-router:
    # Built from patches/router/ (see scripts/build-router-image.sh): the router
    # merges both hops' usage into the standard fields before returning.
    image: ${ROUTER_IMAGE:-localhost/vllm-router:latest}
    container_name: qwen3.8-flash-next-nvfp4-pd-router
    restart: "no"
    network_mode: host
    security_opt: ["label=disable", "apparmor=unconfined"]
    entrypoint: ["vllm-router"]
    environment:
      # the router builds the backend Authorization header from OPENAI_API_KEY
      OPENAI_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      PYTHONUNBUFFERED: "1"
    command:
      - --service-discovery=static
      - --static-backends=http://127.0.0.1:8101,http://127.0.0.1:8102
      - --static-models=nvidia/Qwen3.8-Flash-Next-NVFP4,nvidia/Qwen3.8-Flash-Next-NVFP4
      - --static-model-labels=prefill,decode
      - --prefill-model-labels=prefill
      - --decode-model-labels=decode
      - --routing-logic=disaggregated_prefill
      - --host=0.0.0.0
      - --port=9101
