x-podman:
  in_pod: false

services:
  qwen3.8-flash-next-nvfp4:
    image: ${QWEN_IMAGE:-localhost/vllm-backport:qwen3.8-flash-next-nvfp4}
    container_name: qwen3.8-flash-next-nvfp4
    restart: "no"
    network_mode: host
    ipc: host
    # host PIDs: CUDA interprocess-event pools live in the shared /dev/shm as
    # cuda.shm.0.<pid>; containers with private PID namespaces reuse the same
    # PIDs and overwrite each other's pools (LMCache then waits on the wrong event)
    pid: host
    devices:
      - nvidia.com/gpu=${QWEN_GPU_0:-6}
      - nvidia.com/gpu=${QWEN_GPU_1:-7}
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${QWEN_MODEL_CACHE:?set QWEN_MODEL_CACHE}:/root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4:ro
      - ${VLLM_CACHE:?set VLLM_CACHE}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "26,22"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/snapshots/${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "48"
      VLLM_PLE_NEXT_CHUNK_PREFETCH: "1"
      SAFETENSORS_FAST_GPU: "0"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      VLLM_PP_DECODE_COHORT_BALANCE: "${VLLM_PP_DECODE_COHORT_BALANCE:-1}"
      # Optimisation patches 0005-0012 (README "Decode optimisation": MoE align,
      # fp8 draft head, thin GEMM, PLE hash, MTP draft widths, PLE/GDN without
      # speculative state blocks, fused shared gate), enabled by patch 0013.
      # "off" disables all; a single switch can be overridden by listing it
      # here, e.g. VLLM_QWEN38_THIN_GEMM: "0".
      VLLM_QWEN38_OPT_PROFILE: "default"
    command:
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --host=0.0.0.0
      - --port=8001
      - --sse-keep-alive-interval=${VLLM_SSE_KEEP_ALIVE_INTERVAL:-15}
      - --served-model-name=nvidia/Qwen3.8-Flash-Next-NVFP4
      - --revision=${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      - --pipeline-parallel-size=2
      - --tensor-parallel-size=1
      - --quantization=modelopt
      - --trust-remote-code
      - --max-model-len=1000000
      - --max-num-seqs=32
      - --max-num-batched-tokens=4096
      - --kv-cache-memory=17179869184
      - --kv-cache-dtype=bfloat16
      - '--speculative-config={"method":"mtp","num_speculative_tokens":${QWEN_MTP_TOKENS:-5}}'
      - --per-request-spec-decode-metrics=detailed
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --disable-custom-all-reduce
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --prefix-match-unit=32
      - --mamba-cache-mode=align
      - --prefix-cache-retention-interval=${QWEN_PREFIX_RETENTION_INTERVAL:-1632}
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5557}}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 15m
      retries: 3
  qwen3.8-flash-next-nvfp4-lmcache:
    # Shared server image, the same one the DeepSeek deployment runs; the client
    # image above carries the identical patched payload.
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: qwen3.8-flash-next-nvfp4-lmcache
    restart: "no"
    entrypoint: ["lmcache"]
    command:
      - server
      - --host=127.0.0.1
      - --port=5557
      - --http-host=127.0.0.1
      - --http-port=18557
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1632}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-64}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":${LMCACHE_L2_CAPACITY_GB:-500},"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    network_mode: host
    ipc: host
    # host PIDs: CUDA interprocess-event pools live in the shared /dev/shm as
    # cuda.shm.0.<pid>; containers with private PID namespaces reuse the same
    # PIDs and overwrite each other's pools (LMCache then waits on the wrong event)
    pid: host
    devices:
      - nvidia.com/gpu=${QWEN_GPU_0:-6}
      - nvidia.com/gpu=${QWEN_GPU_1:-7}
    security_opt: ["label=disable", "apparmor=unconfined"]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:-/srv/lmcache/nvidia/Qwen3.8-Flash-Next-NVFP4-mtp5}:/lmcache-l2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18557/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

