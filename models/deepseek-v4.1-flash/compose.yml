# DeepSeek-V4.1-Flash on 4x SM80 80G (TEP4: TP=4 + EP=4), built directly from
# this repository's `vllm` branch (upstream vllm@0e3c8db + SM80 TEP4 fusions) via
# `bash scripts/build-deepseek-v41-image.sh`, with LMCache L1+L2 KV tier.
#
# Topology-aware: automatically detects NVLink vs PCIe P2P at startup with zero
# Python edits (`ampere_peer_topology()` -> "nvlink" uses full 192-row Lamport
# collectives; "pcie" uses bounded low-M Lamport + Ring NCCL fallback).
x-podman:
  in_pod: false

services:
  deepseek-v4.1-flash-tep4:
    image: ${VLLM_IMAGE:-localhost/vllm-main-sm80:deepseek-v4.1-flash-tep4}
    container_name: deepseek-v4.1-flash-tep4
    restart: "no"
    network_mode: host
    # podman-compose can ignore ipc: host on the pod path; start with
    # --podman-run-args=--ipc=host as well so /dev/shm and CUDA IPC use host IPC.
    ipc: host
    pid: host
    privileged: true
    depends_on:
      deepseek-v4.1-flash-tep4-lmcache:
        condition: service_healthy

    devices:
      - nvidia.com/gpu=${DSV41_GPU_0:-0}
      - nvidia.com/gpu=${DSV41_GPU_1:-1}
      - nvidia.com/gpu=${DSV41_GPU_2:-2}
      - nvidia.com/gpu=${DSV41_GPU_3:-3}

    security_opt:
      - label=disable
      - apparmor=unconfined

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 1048576
        hard: 1048576

    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "64"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      NCCL_IB_DISABLE: "1"
      VLLM_DSV4_MXFP4_DECODE_MAX_TOKENS: "192"
      # Profiles: "tep4_fused" (default: topology-aware deep fusions, auto-detects
      # NVLink vs PCIe P2P) or "tep4_verification" (baseline SM80 verification).
      VLLM_DSV41_OPT_PROFILE: "${VLLM_DSV41_OPT_PROFILE:-tep4_fused}"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/tmp

    volumes:
      - ${MODEL_ROOT:-/root/app/models}:/models:ro
      - ${VLLM_CACHE:-/root/app/.tmp-tep4/cache}:/root/.cache

    command:
      - /models/${DSV41_MODEL_DIR:-DeepSeek-V4.1-Flash-1017}
      - --host=0.0.0.0
      - --port=${VLLM_PORT:-8000}
      - --sse-keep-alive-interval=${VLLM_SSE_KEEP_ALIVE_INTERVAL:-15}
      - --served-model-name=deepseek-ai/DeepSeek-V4.1-Flash
      - --trust-remote-code
      - --disable-custom-all-reduce
      - --dtype=bfloat16
      - --tensor-parallel-size=4
      - --enable-expert-parallel
      - --decode-context-parallel-size=1
      - --pipeline-parallel-size=1
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-1048576}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:-32}
      - --max-num-batched-tokens=${VLLM_MAX_NUM_BATCHED_TOKENS:-3072}
      - --kv-cache-dtype=auto
      - --kv-cache-memory=${VLLM_KV_CACHE_MEMORY:-2200000000}
      - --prefix-cache-retention-interval=${LMCACHE_CHUNK_SIZE:-1024}
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5556}}'
      - '--compilation-config={"cudagraph_mode":"FULL_DECODE_ONLY","max_cudagraph_capture_size":192}'
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - '--engram-config={"cpu_offload":true}'
      - '--speculative-config={"method":"dspark","num_speculative_tokens":5,"use_local_argmax_reduction":true,"enable_adaptive_verification":${VLLM_ADAPTIVE_VERIFICATION:-true},"adaptive_verification_decay":${VLLM_ADAPTIVE_VERIFICATION_DECAY:-0.95}}'
      - --per-request-spec-decode-metrics=detailed
      - --tokenizer-mode=deepseek_v41
      - --enable-auto-tool-choice
      - '--structured-outputs-config={"backend":"auto","disable_any_whitespace":false}'
      - --tool-call-parser=deepseek_v41
      - --reasoning-parser=deepseek_v41
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY in .env}

    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:${VLLM_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      start_period: 20m
      retries: 3

  deepseek-v4.1-flash-tep4-lmcache:
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: deepseek-v4.1-flash-tep4-lmcache
    entrypoint: ["lmcache"]
    restart: "no"
    network_mode: host
    ipc: host
    pid: host
    devices:
      - nvidia.com/gpu=${DSV41_GPU_0:-0}
      - nvidia.com/gpu=${DSV41_GPU_1:-1}
      - nvidia.com/gpu=${DSV41_GPU_2:-2}
      - nvidia.com/gpu=${DSV41_GPU_3:-3}
    security_opt:
      - label=disable
      - apparmor=unconfined
    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:-/root/app/lmcache/deepseek-v41-1017-nvfp4}:/lmcache-l2
    command:
      - server
      - --host=127.0.0.1
      - --port=5556
      - --http-host=127.0.0.1
      - --http-port=18556
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1024}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-8}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":500,"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18556/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30
