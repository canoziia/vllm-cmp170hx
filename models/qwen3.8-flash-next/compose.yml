x-podman:
  in_pod: false

services:
  lmcache:
    image: ${QWEN_IMAGE:-localhost/vllm-backport:qwen38-cmp170hx-final}
    container_name: qwen38-lmcache
    restart: "no"
    entrypoint: ["lmcache"]
    command:
      - server
      - --host=127.0.0.1
      - --port=5557
      - --http-host=127.0.0.1
      - --http-port=18557
      - --chunk-size=1600
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-64}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":500,"adopt_existing":true}'
    network_mode: host
    ipc: host
    devices: ["nvidia.com/gpu=6", "nvidia.com/gpu=7"]
    security_opt: ["label=disable", "apparmor=unconfined"]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:-/mnt/lmcache-sdb/nvidia/Qwen3.8-Flash-Next-NVFP4}:/lmcache-l2
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18557/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  qwen:
    image: ${QWEN_IMAGE:-localhost/vllm-backport:qwen38-cmp170hx-final}
    container_name: qwen38-author-nvfp4
    depends_on:
      lmcache:
        condition: service_healthy
    restart: "no"
    network_mode: host
    ipc: host
    stop_grace_period: 10m
    devices: ["nvidia.com/gpu=6", "nvidia.com/gpu=7"]
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${QWEN_MODEL_CACHE:?set QWEN_MODEL_CACHE}:/root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4:ro
      - ${VLLM_CACHE:?set VLLM_CACHE}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "26,22"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--nvidia--Qwen3.8-Flash-Next-NVFP4/snapshots/${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "48"
      VLLM_PLE_NEXT_CHUNK_PREFETCH: "1"
      SAFETENSORS_FAST_GPU: "0"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_P2P_DISABLE: "1"
      NCCL_IB_DISABLE: "1"
      NCCL_CUMEM_HOST_ENABLE: "0"
      PYTHONUNBUFFERED: "1"
    command:
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --host=0.0.0.0
      - --port=8001
      - --served-model-name=nvidia/Qwen3.8-Flash-Next-NVFP4
      - --revision=${QWEN_REVISION:-fc694b54fb0174e0913e6adf86691ef85a4ead47}
      - --pipeline-parallel-size=2
      - --tensor-parallel-size=1
      - --quantization=modelopt
      - --trust-remote-code
      - --max-model-len=1000000
      - --max-num-seqs=64
      - --max-num-batched-tokens=4096
      - --kv-cache-memory=17716740096
      - --kv-cache-dtype=bfloat16
      - '--speculative-config={"method":"mtp","num_speculative_tokens":3}'
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}'
      - '--hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --disable-custom-all-reduce
      - --no-enable-flashinfer-autotune
      - --enable-prefix-caching
      - --mamba-cache-mode=align
      - --prefix-cache-retention-interval=1600
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5557}}'
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --reasoning-parser=qwen3
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true,"enable_in_reasoning":true}'
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
