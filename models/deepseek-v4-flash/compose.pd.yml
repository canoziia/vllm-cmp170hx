services:
  deepseek-v4-flash-lmcache:
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: deepseek-v4-flash-lmcache
    restart: "no"
    entrypoint: ["lmcache"]
    network_mode: host
    # start with: podman compose -f compose.pd.yml --podman-run-args=--ipc=host up -d
    ipc: host
    devices:
      - nvidia.com/gpu=2
      - nvidia.com/gpu=3
      - nvidia.com/gpu=4
      - nvidia.com/gpu=7
      - nvidia.com/gpu=8
      - nvidia.com/gpu=9
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:?set LMCACHE_L2_PATH}:/lmcache-l2
    command:
      - server
      - --host=127.0.0.1
      - --port=5558
      - --http-host=127.0.0.1
      - --http-port=18558
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1024}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-64}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":${LMCACHE_L2_CAPACITY_GB:-500},"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18558/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  deepseek-v4-flash-prefill:
    image: ${DSFLASH_IMAGE:-localhost/vllm-backport:deepseek-v4.1-flash}
    container_name: deepseek-v4-flash-prefill
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    ipc: host
    stop_grace_period: 10m
    devices:
      - nvidia.com/gpu=2
      - nvidia.com/gpu=3
      - nvidia.com/gpu=4
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${DSFLASH_MODEL_CACHE:?set DSFLASH_MODEL_CACHE}:/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-Vision-Exp:ro
      - ${VLLM_CACHE_PREFILL:?set VLLM_CACHE_PREFILL}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "15,16,12"   # must match decode: the resolved KV
      #   geometry depends on the partition and on the speculative depth, and
      #   the single shared LMCache server can only hold one layout.
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/vllm/tmp
    command:
      - deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - --revision=${DSFLASH_REVISION:-6821d6ad3681a4b137b066b76094fa82ebd0a380}
      - --host=0.0.0.0
      - --port=8201
      - --served-model-name=deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - --pipeline-parallel-size=3
      - --tensor-parallel-size=1
      - --trust-remote-code
      - --max-model-len=${DSFLASH_MAX_MODEL_LEN:-1048576}
      - --max-num-seqs=${DSFLASH_MAX_NUM_SEQS:-10}
      - --max-num-batched-tokens=${DSFLASH_MAX_BATCHED_TOKENS:-2048}
      - --kv-cache-memory=${DSFLASH_KV_CACHE_MEMORY:-3435973632}
      - --kv-cache-dtype=fp8_ds_mla
      - --disable-custom-all-reduce
      - --enable-prefix-caching
      # the LMCache fork needs a state checkpoint at every chunk boundary
      - --prefix-cache-retention-interval=${LMCACHE_CHUNK_SIZE:-1024}
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8],"max_cudagraph_capture_size":8}'
      - '--speculative-config={"method":"dspark","num_speculative_tokens":6}'
      - --per-request-spec-decode-metrics=detailed
      - --tokenizer-mode=deepseek_v4
      - --enable-auto-tool-choice
      - --tool-call-parser=deepseek_v4
      - --reasoning-parser=deepseek_v4
      - '--structured-outputs-config={"backend":"auto","disable_any_whitespace":false}'
      - --enable-prompt-tokens-details
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_ip":"127.0.0.1","kv_port":14581,"kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5558}}'
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8201/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3

  deepseek-v4-flash-decode:
    image: ${DSFLASH_IMAGE:-localhost/vllm-backport:deepseek-v4.1-flash}
    container_name: deepseek-v4-flash-decode
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    ipc: host
    stop_grace_period: 10m
    devices:
      - nvidia.com/gpu=7
      - nvidia.com/gpu=8
      - nvidia.com/gpu=9
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${DSFLASH_MODEL_CACHE:?set DSFLASH_MODEL_CACHE}:/root/.cache/huggingface/hub/models--deepseek-ai--DeepSeek-V4-Flash-Vision-Exp:ro
      - ${VLLM_CACHE_DECODE:?set VLLM_CACHE_DECODE}:/root/.cache/vllm
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_PP_LAYER_PARTITION: "15,16,12"
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
      NCCL_ALGO: Ring
      NCCL_PROTO: Simple
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/vllm/tmp
    command:
      - deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - --revision=${DSFLASH_REVISION:-6821d6ad3681a4b137b066b76094fa82ebd0a380}
      - --host=0.0.0.0
      - --port=8202
      - --served-model-name=deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - --pipeline-parallel-size=3
      - --tensor-parallel-size=1
      - --trust-remote-code
      - --max-model-len=${DSFLASH_MAX_MODEL_LEN:-1048576}
      - --max-num-seqs=${DSFLASH_MAX_NUM_SEQS:-10}
      - --max-num-batched-tokens=${DSFLASH_MAX_BATCHED_TOKENS:-2048}
      - --kv-cache-memory=${DSFLASH_KV_CACHE_MEMORY:-3435973632}
      - --kv-cache-dtype=fp8_ds_mla
      - --disable-custom-all-reduce
      - --enable-prefix-caching
      - --prefix-cache-retention-interval=${LMCACHE_CHUNK_SIZE:-1024}
      - '--compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[1,2,4,8],"max_cudagraph_capture_size":8}'
      - '--speculative-config={"method":"dspark","num_speculative_tokens":6}'
      - --per-request-spec-decode-metrics=detailed
      - --tokenizer-mode=deepseek_v4
      - --enable-auto-tool-choice
      - --tool-call-parser=deepseek_v4
      - --reasoning-parser=deepseek_v4
      - '--structured-outputs-config={"backend":"auto","disable_any_whitespace":false}'
      - --enable-prompt-tokens-details
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_ip":"127.0.0.1","kv_port":14582,"kv_connector_extra_config":{"lmcache.mp.host":"127.0.0.1","lmcache.mp.port":5558}}'
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8202/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3

  deepseek-v4-flash-pd-router:
    # Built from patches/router/ (see scripts/build-router-image.sh): the router
    # merges both hops' usage into the standard fields before returning.
    image: ${ROUTER_IMAGE:-localhost/vllm-router:latest}
    container_name: deepseek-v4-flash-pd-router
    restart: "no"
    network_mode: host
    security_opt: ["label=disable", "apparmor=unconfined"]
    entrypoint: ["vllm-router"]
    environment:
      # the router builds the backend Authorization header from OPENAI_API_KEY
      OPENAI_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      PYTHONUNBUFFERED: "1"
    command:
      - --service-discovery=static
      - --static-backends=http://127.0.0.1:8201,http://127.0.0.1:8202
      - --static-models=deepseek-ai/DeepSeek-V4-Flash-Vision-Exp,deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
      - --static-model-labels=prefill,decode
      - --prefill-model-labels=prefill
      - --decode-model-labels=decode
      - --routing-logic=disaggregated_prefill
      - --host=0.0.0.0
      - --port=9102
