# DeepSeek-V4-Flash with prefill/decode disaggregation, six GPUs.
#
# Model: deepseek-ai/DeepSeek-V4-Flash (model_type deepseek_v4,
# 43 transformer layers, num_nextn_predict_layers 1, fp8 e4m3 / fp4 experts).
# This is NOT DeepSeek-V4.1 (deepseek_v4, 40 layers): the model-specific flags
# below therefore default to values that can be overridden from .env, and the
# runtime names (tokenizer mode, parsers, speculative method, KV dtype) must be
# confirmed against the image that is actually used.
#
# Everything that is not model-specific follows the DeepSeek-V4.1 deployment:
# spawn workers, breakable CUDA graph, sparse-indexer logits cap, decode cohort
# balance, NCCL ring/simple, no IB, per-role compile cache.
#
# Disaggregation is realised through the shared LMCache tier: the prefill role
# computes the prompt and stores its KV in the shared LMCache server; the decode
# role retrieves that KV instead of recomputing it and runs the speculative
# (nextn/MTP) decoder.
#
# GPU map (CMP 170HX 20c2, 64 GiB BAR1 each):
#   prefill : GPUs 4,5,6   PP3 even   "15,14,14"   - no speculative decoding
#   decode  : GPUs 7,8,9   PP3 uneven "15,15,13"   - nextn/MTP on the last rank
#   lmcache : sees GPUs 4..9 because the MP connector exchanges KV over CUDA IPC
x-podman:
  in_pod: false

services:
  deepseek-v4-flash-lmcache-prefill:
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: deepseek-v4-flash-lmcache-prefill
    restart: "no"
    entrypoint: ["lmcache"]
    network_mode: host
    # podman-compose 1.3.0 ignores this key; start with
    #   podman compose -f compose.pd.yml --podman-run-args=--ipc=host up -d
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    devices:
      - nvidia.com/gpu=4
      - nvidia.com/gpu=5
      - nvidia.com/gpu=6
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:?set LMCACHE_L2_PATH}:/lmcache-l2
    command:
      - server
      - --host=127.0.0.1
      - --port=5558
      - --http-host=127.0.0.1
      - --http-port=18558
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1024}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-8}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":${LMCACHE_L2_CAPACITY_GB:-500},"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18558/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  deepseek-v4-flash-lmcache-decode:
    image: ${LMCACHE_IMAGE:-localhost/lmcache-server:latest}
    container_name: deepseek-v4-flash-lmcache-decode
    restart: "no"
    entrypoint: ["lmcache"]
    network_mode: host
    # podman-compose 1.3.0 ignores this key; start with
    #   podman compose -f compose.pd.yml --podman-run-args=--ipc=host up -d
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    devices:
      - nvidia.com/gpu=7
      - nvidia.com/gpu=8
      - nvidia.com/gpu=9
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      PYTHONUNBUFFERED: "1"
    volumes:
      - ${LMCACHE_L2_PATH:?set LMCACHE_L2_PATH}:/lmcache-l2
    command:
      - server
      - --host=127.0.0.1
      - --port=5568
      - --http-host=127.0.0.1
      - --http-port=18568
      - --chunk-size=${LMCACHE_CHUNK_SIZE:-1024}
      - --separate-object-groups
      - --l1-size-gb=${LMCACHE_L1_SIZE_GB:-8}
      - --eviction-policy=LRU
      - --max-workers=8
      - '--l2-adapter={"type":"fs_native","base_path":"/lmcache-l2","num_workers":2,"use_odirect":false,"max_capacity_gb":${LMCACHE_L2_CAPACITY_GB:-500},"adopt_existing":true,"eviction":{"eviction_policy":"LRU"}}'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18568/status"]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  deepseek-v4-flash-prefill:
    image: ${DSFLASH_IMAGE:-localhost/vllm-backport:deepseek-v4.1-flash}
    container_name: deepseek-v4-flash-prefill
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    stop_grace_period: 10m
    depends_on:
      deepseek-v4-flash-lmcache-prefill:
        condition: service_healthy
    devices:
      - nvidia.com/gpu=4
      - nvidia.com/gpu=5
      - nvidia.com/gpu=6
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${MODEL_ROOT:?set MODEL_ROOT}:/models:ro
      - ${VLLM_CACHE_PREFILL:?set VLLM_CACHE_PREFILL}:/root/.cache
    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_PP_LAYER_PARTITION: "15,15,13"   # must match decode: the KV block geometry
      #   depends on the partition, so the shared LMCache tier needs one layout.
      VLLM_CPU_OFFLOAD_GB_PER_RANK: "0,0,0"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "128"
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      NCCL_ALGO: "Ring"
      NCCL_PROTO: "Simple"
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/tmp
    command:
      - /models/DeepSeek-V4-Flash
      - --host=0.0.0.0
      - --port=8201
      - --served-model-name=${DSFLASH_SERVED_NAME:-deepseek-ai/DeepSeek-V4-Flash}
      - --pipeline-parallel-size=3
      - --tensor-parallel-size=1
      - --max-model-len=${DSFLASH_MAX_MODEL_LEN:-1048576}
      - --max-num-seqs=${DSFLASH_PREFILL_MAX_NUM_SEQS:-4}
      - --max-num-batched-tokens=${PREFILL_MAX_BATCHED_TOKENS:-4096}
      - --kv-cache-dtype=${DSFLASH_KV_CACHE_DTYPE:-fp8_ds_mla}
      - --kv-cache-memory=${PREFILL_KV_CACHE_MEMORY:-4294967296}
      - --prefix-cache-retention-interval=${DSFLASH_PREFIX_RETENTION_INTERVAL:-1024}
      - '--compilation-config={"cudagraph_mode":"PIECEWISE"}'
      - --trust-remote-code
      - --disable-custom-all-reduce
      - --enable-prefix-caching
      - --tokenizer-mode=${DSFLASH_TOKENIZER_MODE:-deepseek_v4}
      # Both roles must declare the same speculative depth: the shared L2 key is
      # (rank, object group) but the object size depends on this geometry, and a
      # mismatch shows up as "incomplete read ... expected N, got M" (= zero hits).
      - '--speculative-config=${DSFLASH_SPECULATIVE_CONFIG:-{"method":"mtp","num_speculative_tokens":1}}'
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.server_urls":["127.0.0.1:5558"]}}'
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8201/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3

  deepseek-v4-flash-decode:
    image: ${DSFLASH_IMAGE:-localhost/vllm-backport:deepseek-v4.1-flash}
    container_name: deepseek-v4-flash-decode
    restart: "no"
    network_mode: host
    # start with: podman compose --podman-run-args=--ipc=host up -d
    # (podman-compose 1.3.0 ignores this key; node1 uses the same flag)
    ipc: host
    stop_grace_period: 10m
    depends_on:
      deepseek-v4-flash-lmcache-prefill:
        condition: service_healthy
    devices:
      - nvidia.com/gpu=7
      - nvidia.com/gpu=8
      - nvidia.com/gpu=9
    security_opt: ["label=disable", "apparmor=unconfined"]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    volumes:
      - ${MODEL_ROOT:?set MODEL_ROOT}:/models:ro
      - ${VLLM_CACHE_DECODE:?set VLLM_CACHE_DECODE}:/root/.cache
    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: "spawn"
      VLLM_PP_LAYER_PARTITION: "15,15,13"   # nextn layers ride on the last rank
      VLLM_CPU_OFFLOAD_GB_PER_RANK: "0,0,0"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: "128"
      VLLM_PP_DECODE_COHORT_BALANCE: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      NCCL_ALGO: "Ring"
      NCCL_PROTO: "Simple"
      NCCL_IB_DISABLE: "1"
      PYTHONUNBUFFERED: "1"
      TMPDIR: /root/.cache/tmp
    command:
      - /models/DeepSeek-V4-Flash
      - --host=0.0.0.0
      - --port=8202
      - --served-model-name=${DSFLASH_SERVED_NAME:-deepseek-ai/DeepSeek-V4-Flash}
      - --pipeline-parallel-size=3
      - --tensor-parallel-size=1
      - --max-model-len=${DSFLASH_MAX_MODEL_LEN:-1048576}
      - --max-num-seqs=${DSFLASH_DECODE_MAX_NUM_SEQS:-8}
      - --max-num-batched-tokens=${DECODE_MAX_BATCHED_TOKENS:-4096}
      - --kv-cache-dtype=${DSFLASH_KV_CACHE_DTYPE:-fp8_ds_mla}
      - --kv-cache-memory=${DECODE_KV_CACHE_MEMORY:-4294967296}
      - --prefix-cache-retention-interval=${DSFLASH_PREFIX_RETENTION_INTERVAL:-1024}
      - '--compilation-config={"cudagraph_mode":"PIECEWISE"}'
      - --trust-remote-code
      - --disable-custom-all-reduce
      - --enable-prefix-caching
      - --tokenizer-mode=${DSFLASH_TOKENIZER_MODE:-deepseek_v4}
      - '--speculative-config=${DSFLASH_SPECULATIVE_CONFIG:-{"method":"mtp","num_speculative_tokens":1}}'
      - '--kv-transfer-config={"kv_connector":"LMCacheMPConnector","kv_connector_module_path":"lmcache.integration.vllm.lmcache_mp_connector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.server_urls":["127.0.0.1:5568"]}}'
      - --enable-auto-tool-choice
      - --tool-call-parser=${DSFLASH_TOOL_CALL_PARSER:-deepseek_v4}
      - --reasoning-parser=${DSFLASH_REASONING_PARSER:-deepseek_v4}
      - '--structured-outputs-config={"backend":"auto","disable_any_whitespace":false}'
      - --enable-prompt-tokens-details
      - --api-key=${VLLM_API_KEY:?set VLLM_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Authorization: Bearer ${VLLM_API_KEY}", "http://127.0.0.1:8202/health"]
      interval: 30s
      timeout: 10s
      start_period: 30m
      retries: 3
  deepseek-v4-flash-pd-router:
    image: ${DEFAULT_ROUTER_IMAGE:-docker.1ms.run/library/python:3.12-slim}
    container_name: deepseek-v4-flash-pd-router
    restart: "no"
    network_mode: host
    # Engine images need apparmor=unconfined for CUDA; a plain Python service needs it
    # for socketpair() (uvicorn's event loop) - the same AppArmor class of problem.
    security_opt: ["label=disable", "apparmor=unconfined"]
    # Community-maintained PD front end: vLLM production-stack router, pinned to the
    # vllm-stack-0.1.13 release, static discovery so no Kubernetes is required.
    # Routing logic "disaggregated_prefill" orchestrates the two hops AND sends the
    # backend API key (send_request_to_prefiller/decode). The *orchestrated* variant
    # injects kv_transfer_params but sends no Authorization header (request.py:833 in
    # 0.1.13 and in main), so it 401s against engines started with --api-key; we do not
    # need kv_transfer_params because our KV moves through the shared LMCache tier.
    entrypoint: ["bash", "-lc"]
    environment:
      PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
      SETUPTOOLS_SCM_PRETEND_VERSION: "0.1.13"
      # the router builds the backend Authorization header from OPENAI_API_KEY
      OPENAI_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY}
      PYTHONUNBUFFERED: "1"
    command:
      - >-
        pip install -q --disable-pip-version-check "vllm-router @ https://codeload.github.com/vllm-project/production-stack/tar.gz/refs/tags/vllm-stack-0.1.13" && exec vllm-router --service-discovery static --static-backends "http://127.0.0.1:8201,http://127.0.0.1:8202" --static-models "deepseek-ai/DeepSeek-V4-Flash,deepseek-ai/DeepSeek-V4-Flash" --static-model-labels "prefill,decode" --prefill-model-labels prefill --decode-model-labels decode --routing-logic disaggregated_prefill --host 0.0.0.0 --port 9102
