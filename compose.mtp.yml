services:
  qwen38-flash-next:
    image: ${VLLM_IMAGE:-localhost/vllm-cmp170hx:qwen3.8-flash-next}
    container_name: qwen38-flash-next
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    shm_size: "16g"
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - ${QWEN_MODEL_CACHE:?}:/root/.cache/huggingface/hub/models--Qwen--Qwen3.8-Flash-Next-FP8:ro
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_PP_LAYER_PARTITION: "12,12,12,12"
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_PLE_NVME_PATH: /root/.cache/huggingface/hub/models--Qwen--Qwen3.8-Flash-Next-FP8/snapshots/${QWEN_SNAPSHOT:-bcd9f01ddc9cff2316eb84281bebcd5b058bddce}
      VLLM_PLE_NVME_BACKEND: pread
      VLLM_PLE_NVME_PREAD_WORKERS: "48"
      SAFETENSORS_FAST_GPU: "0"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
    command:
      - Qwen/Qwen3.8-Flash-Next-FP8
      - --pipeline-parallel-size=4
      - --tensor-parallel-size=1
      - --distributed-executor-backend=mp
      - --language-model-only
      - --max-model-len=1000000
      - '--hf-overrides={"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"rope_type":"yarn","rope_theta":10000000,"partial_rotary_factor":0.25,"factor":4.0,"original_max_position_embeddings":262144}}}'
      - --kv-cache-dtype=bfloat16
      - --mamba-ssm-cache-dtype=bfloat16
      - --mamba-cache-mode=align
      - '--speculative-config={"method":"mtp","num_speculative_tokens":1}'
      - --api-key=${VLLM_API_KEY:-change-me}
      - --served-model-name=Qwen/Qwen3.8-Flash-Next-FP8
      - --enable-auto-tool-choice
      - --reasoning-parser=qwen3
      - --tool-call-parser=qwen3_coder
      - '--structured-outputs-config={"backend":"xgrammar","disable_any_whitespace":true}'
      - --max-num-seqs=16
      - --max-num-batched-tokens=1024
      - --gpu-memory-utilization=0.95
      - --long-prefill-token-threshold=0
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-flashinfer-autotune
