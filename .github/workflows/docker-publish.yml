name: Docker

# Validates the patched `vllm` branch offline on every push/PR, and builds &
# publishes the unified SM80 vLLM image (and shared LMCache server image when
# LMCache inputs change) to GHCR (plus Docker Hub when DOCKER_USERNAME /
# DOCKER_PASSWORD secrets are configured).

on:
  push:
    branches: ["main", "vllm"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      build_vllm:
        description: "Build and push vLLM SM80 image"
        type: boolean
        default: true
      build_lmcache:
        description: "Build and push shared LMCache server image"
        type: boolean
        default: false
      build_router:
        description: "Build and push patched vLLM PD router image"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  PLATFORMS: linux/amd64
  # Empty unless the repository defines DOCKER_USERNAME / DOCKER_PASSWORD
  # secrets; the Docker Hub steps below are skipped in that case.
  DOCKERHUB_USER: ${{ secrets.DOCKER_USERNAME }}

jobs:
  validate:
    name: Validate vLLM branch and manifests
    runs-on: ubuntu-latest
    outputs:
      build_vllm: ${{ steps.plan.outputs.build_vllm }}
      build_lmcache: ${{ steps.plan.outputs.build_lmcache }}
      build_router: ${{ steps.plan.outputs.build_router }}
      vllm_sha: ${{ steps.plan.outputs.vllm_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Fetch vllm branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/vllm:refs/heads/vllm

      - name: Run offline vLLM & DeepSeek-V4.1 test gates
        run: |
          set -euo pipefail
          VALIDATE_ONLY=1 ALLOW_UNPINNED_VLLM_BRANCH=1 bash scripts/build-deepseek-v41-image.sh

      - name: Decide build targets
        id: plan
        run: |
          set -euo pipefail
          vllm_sha=$(git rev-parse --short=12 refs/heads/vllm)
          build_vllm=false
          build_lmc=false
          build_rtr=false

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            build_vllm="${{ inputs.build_vllm }}"
            build_lmc="${{ inputs.build_lmcache }}"
            build_rtr="${{ inputs.build_router }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_NAME}" == "vllm" ]]; then
              build_vllm=true
            else
              changed=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || echo "")
              echo "Changed files on main:"
              echo "$changed"
              if grep -qE '^(manifests/vllm\.env|manifests/lmcache\.env|patches/lmcache/|models/deepseek-v4\.1-flash/native/|scripts/build-deepseek-v41-image\.sh|\.github/workflows/docker-publish\.yml)' <<<"$changed"; then
                build_vllm=true
              fi
              if grep -qE '^(manifests/lmcache\.env|patches/lmcache/|scripts/(apply|build|ensure|test)-lmcache|\.github/workflows/docker-publish\.yml)' <<<"$changed"; then
                build_lmc=true
              fi
              if grep -qE '^(manifests/router\.env|patches/router/|scripts/(build|test)-router|\.github/workflows/docker-publish\.yml)' <<<"$changed"; then
                build_rtr=true
              fi
            fi
          fi

          {
            echo "vllm_sha=${vllm_sha}"
            echo "build_vllm=${build_vllm}"
            echo "build_lmcache=${build_lmc}"
            echo "build_router=${build_rtr}"
          } >> "$GITHUB_OUTPUT"
          echo "plan: vllm_sha=${vllm_sha} build_vllm=${build_vllm} build_lmcache=${build_lmc} build_router=${build_rtr}"

  build_lmcache:
    name: Push LMCache server image
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.build_lmcache == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare patched LMCache server context
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker \
          PREPARE_CONTEXT_ONLY="${RUNNER_TEMP}/context-lmcache" \
          bash scripts/build-lmcache-server-image.sh

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute image names
        id: image
        run: |
          set -euo pipefail
          repo_lc="${IMAGE_NAME,,}"
          imgs=("${REGISTRY}/${repo_lc}/lmcache-server")
          if [[ -n "${DOCKERHUB_USER:-}" ]]; then
            imgs+=("docker.io/${DOCKERHUB_USER,,}/${IMAGE_NAME##*/}-lmcache-server")
          fi
          {
            echo "primary=${REGISTRY}/${repo_lc}/lmcache-server"
            echo "images<<__EOF__"
            printf '%s\n' "${imgs[@]}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push LMCache server image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context-lmcache
          file: ${{ runner.temp }}/context-lmcache/Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          PRIMARY: ${{ steps.image.outputs.primary }}
        run: |
          test -n "$DIGEST"
          cosign sign --yes "${PRIMARY}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### LMCache server image published"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build_router:
    name: Push vLLM PD router image
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.build_router == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare patched vLLM router context
        run: |
          set -euo pipefail
          ROUTER_BASE_IMAGE=python:3.12-slim \
          ROUTER_PIP_INDEX_URL=https://pypi.org/simple \
          PREPARE_CONTEXT_ONLY="${RUNNER_TEMP}/context-router" \
          bash scripts/build-router-image.sh

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute image names
        id: image
        run: |
          set -euo pipefail
          repo_lc="${IMAGE_NAME,,}"
          imgs=("${REGISTRY}/${repo_lc}/vllm-router")
          if [[ -n "${DOCKERHUB_USER:-}" ]]; then
            imgs+=("docker.io/${DOCKERHUB_USER,,}/${IMAGE_NAME##*/}-vllm-router")
          fi
          {
            echo "primary=${REGISTRY}/${repo_lc}/vllm-router"
            echo "images<<__EOF__"
            printf '%s\n' "${imgs[@]}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push vLLM router image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context-router
          file: ${{ runner.temp }}/context-router/Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          PRIMARY: ${{ steps.image.outputs.primary }}
        run: |
          test -n "$DIGEST"
          cosign sign --yes "${PRIMARY}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### vLLM PD router image published"
            echo
            echo "- digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  build_vllm:
    name: Push vLLM SM80 image
    needs: validate
    if: github.event_name != 'pull_request' && needs.validate.outputs.build_vllm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Show available disk space
        run: df -h

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch vllm branch
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/heads/vllm:refs/heads/vllm

      - name: Prepare vLLM SM80 build context
        run: |
          set -euo pipefail
          CONTAINER_ENGINE=docker \
          LMCACHE_PAYLOAD_SOURCE=payload-image \
          ALLOW_UNPINNED_VLLM_BRANCH=1 \
          PREPARE_CONTEXT_ONLY="${RUNNER_TEMP}/context-vllm" \
          bash scripts/build-deepseek-v41-image.sh

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Compute image names and tags
        id: image
        env:
          VLLM_SHA: ${{ needs.validate.outputs.vllm_sha }}
        run: |
          set -euo pipefail
          repo_lc="${IMAGE_NAME,,}"
          imgs=("${REGISTRY}/${repo_lc}")
          if [[ -n "${DOCKERHUB_USER:-}" ]]; then
            imgs+=("docker.io/${DOCKERHUB_USER,,}/${IMAGE_NAME##*/}")
          fi
          {
            echo "primary=${REGISTRY}/${repo_lc}"
            echo "images<<__EOF__"
            printf '%s\n' "${imgs[@]}"
            echo "__EOF__"
            echo "tags<<__EOF__"
            echo "type=raw,value=latest"
            echo "type=raw,value=${VLLM_SHA}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.images }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Build and push vLLM SM80 image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context-vllm
          file: ${{ runner.temp }}/context-vllm/Containerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=vllm-sm80
          cache-to: type=gha,mode=min,scope=vllm-sm80

      - name: Sign the published Docker image
        env:
          COSIGN_EXPERIMENTAL: "true"
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          PRIMARY: ${{ steps.image.outputs.primary }}
        run: |
          test -n "$DIGEST"
          cosign sign --yes "${PRIMARY}@${DIGEST}"

      - name: Summary
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VLLM_SHA: ${{ needs.validate.outputs.vllm_sha }}
        run: |
          {
            echo "### vLLM SM80 image published"
            echo
            echo "- \`vllm\` branch: \`${VLLM_SHA}\`"
            echo "- platforms: \`${PLATFORMS}\`"
            echo "- digest: \`${DIGEST}\`"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
